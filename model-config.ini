version = 1

[*]
cache-type-k = q8_0
cache-type-v = q8_0
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
kv-offload = true
kv-unified = true
no-host = true
cache-ram = -1
metrics = true
load-mode = mmap
lazy-mode = on
ubatch-size=1024
sleep-idle-seconds = 120
fit = off
jinja = true
reasoning-budget-message = "... Okay, I've thought enough. Lets get this bread."

[qwen]
hf-repo = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_XL
spec-draft-hf = aminya/Qwen3.6-35B-A3B-DFlash2-GGUF:BF16
spec-type = draft-dflash
spec-draft-n-max = 7
spec-draft-n-ubatch = 256
spec-draft-sampling = probabilistic
c=80000
no-mmproj=true
keep = -1
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 1.5
samplers = top_k;penalties;top_p;min_p;temperature
split-mode = layer
tensor-split = 20,7
parallel = 1
sleep-idle-seconds = 7200

[flint]
hf-repo = ggml-org/Flint-GGUF:Q4_K_M
spec-draft-hf = incoai/Flint-DFlash2-GGUF:Q4_K_M
spec-type = draft-dflash
spec-draft-n-max = 7
spec-draft-n-ubatch = 256
spec-draft-sampling = probabilistic
c = 32768
split-mode = layer
parallel = 1
swa-full = true
checkpoint-min-step = 256
ctx-checkpoints = 64
dynatemp-range = 0.5
dynatemp-exp = 1.0
